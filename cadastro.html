<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Flash News</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="pagina-conta">


<div class="caixa-conta">

    <a href="index.html">

        <img
            src="logo menor.png"
            alt="Flash News"
            class="logo-conta">

    </a>


    <h1>Criar conta</h1>

    <p>
        Faça seu cadastro no Flash News
    </p>


    <form onsubmit="cadastro(event)">

        <label>Nome</label>

        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
            required>


        <label>E-mail</label>

        <input
            type="email"
            id="email"
            placeholder="Digite seu e-mail"
            required>


        <label>Senha</label>

        <input
            type="password"
            id="senha"
            placeholder="Crie uma senha"
            required>


        <label>Confirmar senha</label>

        <input
            type="password"
            id="confirmarSenha"
            placeholder="Digite a senha novamente"
            required>


        <button type="submit">
            Criar conta
        </button>

    </form>


    <p class="troca">

        Já possui uma conta?

        <a href="login.html">
            Entrar
        </a>

    </p>


    <a href="index.html" class="voltar">
        ← Voltar para o site
    </a>

</div>


<script src="scirpt.js"></script>

</body>

</html>
