<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Flash News</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="pagina-conta">


<div class="caixa-conta">

    <a href="index.html">

        <img
            src="logo menor.png"
            alt="Flash News"
            class="logo-conta">

    </a>


    <h1>Entrar</h1>

    <p>
        Entre na sua conta Flash News
    </p>


    <form onsubmit="login(event)">

        <label>E-mail</label>

        <input
            type="email"
            id="emailLogin"
            placeholder="Digite seu e-mail"
            required>


        <label>Senha</label>

        <input
            type="password"
            id="senhaLogin"
            placeholder="Digite sua senha"
            required>


        <button type="submit">
            Entrar
        </button>

    </form>


    <p class="troca">

        Ainda não tem uma conta?

        <a href="cadastro.html">
            Criar conta
        </a>

    </p>


    <a href="index.html" class="voltar">
        ← Voltar para o site
    </a>

</div>

<script src="scirpt.js"></script>

</body>

</html>
