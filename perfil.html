<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil - Flash News</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="cabecalho">

    <a href="index.html" class="logo">

        <img src="logo menor.png" alt="Flash News">

    </a>

    <nav class="menu">

        <a href="index.html">Início</a>
        <a href="brasil.html">Brasil</a>
        <a href="politica.html">Política</a>
        <a href="mundo.html">Mundo</a>
        <a href="esportes.html">Esportes</a>
        <a href="tecnologia.html">Tecnologia</a>
        <a href="entretenimento.html">Entretenimento</a>

    </nav>

    <div class="conta" id="areaConta"></div>

</header>


<main class="perfil-page">

    <section class="perfil-card">
        <div class="perfil-topo">
            <div class="avatar" id="avatarInicial">U</div>
            <div>
                <span class="perfil-label">MINHA CONTA</span>
                <h1>Meu Perfil</h1>
                <p>Gerencie suas informações e acompanhe suas notícias salvas.</p>
            </div>
        </div>

        <div class="perfil-dados">
            <div class="dado">
                <span>Nome</span>
                <strong id="nomeUsuario"></strong>
            </div>
            <div class="dado">
                <span>E-mail</span>
                <strong id="emailUsuario"></strong>
            </div>
            <div class="dado">
                <span>Conta criada em</span>
                <strong id="dataUsuario"></strong>
            </div>
            <div class="dado">
                <span>Status</span>
                <strong class="status-online">● Conta ativa</strong>
            </div>
        </div>

        <div class="perfil-acoes">
            <a href="index.html" class="perfil-botao secundario">← Voltar ao Flash News</a>
            <button type="button" class="perfil-botao perigo" onclick="sair()">Sair da conta</button>
        </div>
    </section>

    <section class="salvos-card">
        <div class="titulo">
            <h2>📰 Minhas notícias salvas</h2>
            <span></span>
        </div>
        <div id="noticiasSalvas"></div>
    </section>

</main>


<script src="scirpt.js"></script>

</body>

</html>
